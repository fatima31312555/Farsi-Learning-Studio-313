<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><title>Fees, classes and activity · Dars</title></head><body>
<header class="top"><div class="wrap"><h1>Dars · Fees, classes and activity</h1><nav><a href="admin.html">Admin panel</a><a href="classroom.html">Student classroom</a><button id="out">Sign out</button></nav></div></header>
<main><div class="wrap"><div class="tabs" id="tabs" role="tablist"></div>
<section id="s-fees"></section><section id="s-lec" class="hide"></section><section id="s-watch" class="hide"></section><section id="s-games" class="hide"></section></div></main><div id="toast" role="status"></div>
<script>
var ST=[],TABS=[["fees","Fees"],["lec","Recorded classes"],["watch","Who is watching"],["games","Game activity"]];
var nm=function(id){var s=ST.find(function(x){return x.id===id});return s?(s.full_name||s.email):"?"};
async function init(){var u=await requireUser();if(!u)return;if(u.profile.role!=="admin"){location.href="dashboard.html";return}
$("out").onclick=signOut;var r=await sb.from("profiles").select("id,full_name,email,phone,role").order("full_name");ST=(r.data||[]).filter(function(x){return x.role==="student"});
$("tabs").innerHTML=TABS.map(function(t,i){return '<button role="tab" data-t="'+t[0]+'" aria-selected="'+(i===0)+'">'+t[1]+'</button>'}).join("");
$("tabs").onclick=function(e){var b=e.target.closest("button");if(b)show(b.dataset.t)};
$("s-fees").onclick=feeClick;$("s-lec").onclick=lecClick;show("fees")}
function show(t){document.querySelectorAll("#tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.t===t)});TABS.forEach(function(x){$("s-"+x[0]).classList.toggle("hide",x[0]!==t)});({fees:fees,lec:lec,watch:watch,games:games})[t]()}
var FEES=[];
async function fees(){var r=await sb.from("fee_balance").select("*").order("due_date");var L=FEES=r.data||[],td=new Date().toISOString().slice(0,10);
var due=L.filter(function(x){return x.balance>0&&x.reminder_date&&x.reminder_date<=td});
var tot=L.reduce(function(a,x){return a+Number(x.amount_due)},0),pd=L.reduce(function(a,x){return a+Number(x.paid)},0);
$("s-fees").innerHTML='<div class="grid" style="margin-bottom:14px"><div class="stat"><b>'+tot+'</b>billed</div><div class="stat"><b>'+pd+'</b>received</div><div class="stat"><b>'+(tot-pd)+'</b>remaining</div></div>'+
(due.length?'<div class="panel"><h3>Send reminders today ('+due.length+')</h3>'+due.map(function(x){return '<div class="row"><span>'+esc(nm(x.student_id))+' · '+x.balance+' due '+x.due_date+'</span><button class="btn sf sm" data-r="'+x.id+'">Send on WhatsApp</button></div>'}).join("")+'</div>':'')+
'<div class="panel"><h3>Add a fee</h3><form id="ff"><div class="row" style="margin-top:0"><select id="fs" required><option value="">Student</option>'+ST.map(function(s){return '<option value="'+s.id+'">'+esc(s.full_name||s.email)+'</option>'}).join("")+'</select><input id="ft" value="Monthly fee" aria-label="Title"><input id="fa" type="number" min="0" step="0.01" placeholder="Amount" required></div><div class="row"><div><label>Due date</label><input id="fd" type="date" required></div><div><label>Send reminder on</label><input id="fr" type="date"></div></div><div class="row"><button class="btn" type="submit">Save fee</button></div></form></div>'+
'<div class="panel"><h3>All fees</h3><div class="scroll"><table><thead><tr><th>Student</th><th>For</th><th>Due</th><th>Amount</th><th>Paid</th><th>Left</th><th></th></tr></thead><tbody>'+L.map(function(x){var st=x.balance<=0?'<span class="tag">Paid</span>':x.due_date<td?'<span class="tag" style="background:var(--no)">Overdue</span>':'<span class="tag gold">Due</span>';return '<tr><td>'+esc(nm(x.student_id))+'</td><td>'+esc(x.title)+'</td><td>'+x.due_date+'</td><td>'+x.amount_due+'</td><td>'+x.paid+'</td><td>'+x.balance+' '+st+'</td><td><button class="btn alt sm" data-p="'+x.id+'">Payment</button> <button class="btn alt sm" data-r="'+x.id+'">Remind</button> <button class="btn alt sm" data-x="'+x.id+'">Delete</button></td></tr>'}).join("")+'</tbody></table></div></div>';
$("ff").onsubmit=async function(e){e.preventDefault();var r=await sb.from("fee_records").insert({student_id:$("fs").value,title:$("ft").value,amount_due:$("fa").value,due_date:$("fd").value,reminder_date:$("fr").value||null});if(r.error)toast(r.error.message);else{toast("Saved");fees()}}}
function remind(x){var s=ST.find(function(a){return a.id===x.student_id})||{},n=s.full_name||"";
var m="السلام علیکم "+n+"،\nیہ فارسی کلاس کی فیس کی ایک مؤدبانہ یاد دہانی ہے۔ آپ کے ذمے "+x.balance+" باقی ہیں، جن کی آخری تاریخ "+x.due_date+" ہے۔ براہِ کرم سہولت کے مطابق ادا فرما دیں۔ شکریہ۔\n\nAssalam o alaikum "+n+", a gentle reminder that "+x.balance+" is remaining for your Farsi class fee, due on "+x.due_date+". Please pay at your convenience. Thank you.";
var ph=(s.phone||"").replace(/\D/g,"");if(!ph){var p=prompt("WhatsApp number with country code, e.g. 923001234567");if(!p)return;ph=p.replace(/\D/g,"");sb.from("profiles").update({phone:ph}).eq("id",s.id).then(function(){s.phone=ph})}
window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(m),"_blank")}
async function feeClick(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset,f=function(id){return FEES.find(function(x){return x.id===id})};
if(d.r)remind(f(d.r));else if(d.p){var o=f(d.p),a=prompt("Amount received (left: "+o.balance+")",o.balance);if(!a)return;var m=prompt("Method (cash, JazzCash, bank...)","cash");var r=await sb.from("fee_payments").insert({record_id:o.id,student_id:o.student_id,amount:a,method:m});if(r.error)toast(r.error.message);else{toast("Payment saved");fees()}}
else if(d.x&&confirm("Delete this fee and its payments?")){await sb.from("fee_records").delete().eq("id",d.x);fees()}}
var ACC=[];
async function lec(){var r=await Promise.all([sb.from("lectures").select("*").order("created_at",{ascending:false}),sb.from("lecture_access").select("lecture_id,student_id")]);var L=r[0].data||[];ACC=r[1].data||[];
$("s-lec").innerHTML='<div class="panel"><h3>Upload a recorded class</h3><form id="lf"><div class="row" style="margin-top:0"><input id="lt" placeholder="Title" required><input id="ltp" placeholder="Main topics, separated by commas"></div><label>Notes students read next to the video</label><textarea id="ln" rows="5" style="width:100%"></textarea><div class="row"><div><label>Video file (up to 50 MB on the free plan)</label><input id="lv" type="file" accept="video/*"></div><div><label>or an unlisted YouTube link</label><input id="lu" placeholder="https://youtu.be/..."></div><div><label>PDF</label><input id="lp" type="file" accept="application/pdf"></div></div><div class="row"><button class="btn" type="submit" id="lb">Upload</button></div></form></div>'+
L.map(function(l){var have=ACC.filter(function(a){return a.lecture_id===l.id}).map(function(a){return a.student_id});return '<div class="panel"><h3>'+esc(l.title)+' <span class="tag">'+have.length+' can watch</span></h3><p class="sub">'+(l.topics||[]).map(esc).join(" · ")+'</p><details><summary>Who can watch</summary><div data-l="'+l.id+'">'+ST.map(function(s){return '<label class="chk"><input type="checkbox" value="'+s.id+'"'+(have.indexOf(s.id)>-1?" checked":"")+'> '+esc(s.full_name||s.email)+'</label>'}).join("")+'<div class="row"><button class="btn sm" data-sv="'+l.id+'">Save access</button><button class="btn alt sm" data-all="'+l.id+'">Select all</button></div></div></details><div class="row"><button class="btn danger sm" data-del="'+l.id+'">Delete class</button></div></div>'}).join("");
$("lf").onsubmit=async function(e){e.preventDefault();var b=$("lb");b.disabled=true;b.textContent="Uploading…";
try{var ins=await sb.from("lectures").insert({title:$("lt").value,topics:$("ltp").value.split(",").map(function(s){return s.trim()}).filter(Boolean),notes:$("ln").value||null,video_url:$("lu").value||null}).select().single();if(ins.error)throw ins.error;
var id=ins.data.id,up={},v=$("lv").files[0],p=$("lp").files[0];
if(v){var x=await sb.storage.from("lectures").upload(id+"/video."+(v.name.split(".").pop()||"mp4"),v);if(x.error)throw x.error;up.video_path=x.data.path}
if(p){var y=await sb.storage.from("lectures").upload(id+"/notes.pdf",p);if(y.error)throw y.error;up.pdf_path=y.data.path}
if(Object.keys(up).length)await sb.from("lectures").update(up).eq("id",id);toast("Uploaded. Now choose who can watch it.");lec()}catch(er){toast(er.message);b.disabled=false;b.textContent="Upload"}}}
async function lecClick(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
if(d.all){document.querySelectorAll('[data-l="'+d.all+'"] input').forEach(function(c){c.checked=true})}
else if(d.sv){var ids=[].map.call(document.querySelectorAll('[data-l="'+d.sv+'"] input:checked'),function(c){return c.value});await sb.from("lecture_access").delete().eq("lecture_id",d.sv);
if(ids.length){var r=await sb.from("lecture_access").insert(ids.map(function(s){return{lecture_id:d.sv,student_id:s}}));if(r.error){toast(r.error.message);return}}toast("Access saved");lec()}
else if(d.del&&confirm("Delete this class, its video and its PDF?")){var f=await sb.storage.from("lectures").list(d.del);if(f.data&&f.data.length)await sb.storage.from("lectures").remove(f.data.map(function(x){return d.del+"/"+x.name}));await sb.from("lectures").delete().eq("id",d.del);lec()}}
async function watch(){var r=await Promise.all([sb.from("lecture_views").select("*").order("last_viewed",{ascending:false}),sb.from("lectures").select("id,title")]),T={};(r[1].data||[]).forEach(function(l){T[l.id]=l.title});
$("s-watch").innerHTML='<div class="panel"><h3>Who is watching what</h3><p class="sub">Progress is the furthest point reached in the video.</p><div class="scroll"><table><thead><tr><th>Student</th><th>Class</th><th>Minutes reached</th><th>Finished</th><th>Last opened</th></tr></thead><tbody>'+((r[0].data||[]).map(function(v){return '<tr><td>'+esc(nm(v.student_id))+'</td><td>'+esc(T[v.lecture_id]||"")+'</td><td>'+Math.round(v.seconds_watched/60)+'</td><td>'+(v.completed?"Yes":"No")+'</td><td>'+new Date(v.last_viewed).toLocaleString()+'</td></tr>'}).join("")||'<tr><td colspan="5">Nobody has opened a class yet.</td></tr>')+'</tbody></table></div></div>'}
async function games(){var r=await sb.from("play_summary").select("*"),S=r.data||[],P={},G={};
S.forEach(function(x){var p=P[x.student_id]||(P[x.student_id]={n:0,x:0,g:0}),g=G[x.game]||(G[x.game]={n:0,x:0,p:0});p.n+=x.plays;p.x+=x.xp;p.g++;g.n+=x.plays;g.x+=x.xp;g.p++});
$("s-games").innerHTML='<div class="panel"><h3>Per student</h3><div class="scroll"><table><thead><tr><th>Student</th><th>Different games tried</th><th>Rounds played</th><th>XP from games</th></tr></thead><tbody>'+(ST.map(function(s){var p=P[s.id]||{n:0,x:0,g:0};return '<tr><td>'+esc(s.full_name||s.email)+'</td><td>'+p.g+'</td><td>'+p.n+'</td><td>'+p.x+'</td></tr>'}).join("")||'<tr><td colspan="4">No students yet.</td></tr>')+'</tbody></table></div></div><div class="panel"><h3>Per game</h3><div class="scroll"><table><thead><tr><th>Game</th><th>Students</th><th>Rounds</th><th>XP</th></tr></thead><tbody>'+Object.keys(G).sort(function(a,b){return G[b].n-G[a].n}).map(function(k){return '<tr><td>'+esc(k)+'</td><td>'+G[k].p+'</td><td>'+G[k].n+'</td><td>'+G[k].x+'</td></tr>'}).join("")+'</tbody></table></div></div>'}
init();
</script></body></html>
