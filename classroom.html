<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><title>Classroom · Dars</title></head><body>
<header class="top"><div class="wrap"><h1><a href="dashboard.html">Dars · Classroom</a></h1><nav><a href="dashboard.html">Dashboard</a><a href="studio.html">Practice studio</a><button id="out">Sign out</button></nav></div></header>
<main><div class="wrap"><div id="list"></div><div id="view" class="hide"></div><div class="panel"><h3>My fees</h3><div id="fees"><p class="sub">Loading…</p></div></div></div></main><div id="toast" role="status"></div>
<script>
var U,V={},cur=null,last=0;
async function init(){var u=await requireUser();if(!u)return;U=u.session.user;$("out").onclick=signOut;
var r=await Promise.all([sb.from("lectures").select("*").order("created_at",{ascending:false}),sb.from("lecture_views").select("*"),sb.from("fee_balance").select("*").order("due_date")]);
(r[1].data||[]).forEach(function(v){V[v.lecture_id]=v});var L=r[0].data||[];window.LEC=L;
$("list").innerHTML='<h2>Recorded classes</h2>'+(L.length?'<div class="grid">'+L.map(function(l){var v=V[l.id];return '<div class="panel"><h3>'+esc(l.title)+'</h3><p class="sub">'+(l.topics||[]).map(esc).join(" · ")+'</p>'+(v?'<span class="tag'+(v.completed?"":" gold")+'">'+(v.completed?"Finished":Math.round(v.seconds_watched/60)+" min watched")+'</span> ':'')+'<div class="row"><button class="btn" data-o="'+l.id+'">Watch and read</button></div></div>'}).join("")+'</div>':'<div class="panel"><p class="sub" style="margin:0">No recorded classes have been shared with you yet.</p></div>');
$("list").onclick=function(e){var b=e.target.closest("button");if(b)openLec(b.dataset.o)};
var F=r[2].data||[];$("fees").innerHTML=F.length?'<div class="scroll"><table><thead><tr><th>For</th><th>Due</th><th>Amount</th><th>Paid</th><th>Left</th></tr></thead><tbody>'+F.map(function(x){return '<tr><td>'+esc(x.title)+'</td><td>'+x.due_date+'</td><td>'+x.amount_due+'</td><td>'+x.paid+'</td><td>'+(x.balance<=0?'<span class="tag">Paid</span>':x.balance)+'</td></tr>'}).join("")+'</tbody></table></div>':'<p class="sub" style="margin:0">No fees recorded yet.</p>'}
async function openLec(id){var l=window.LEC.find(function(x){return x.id===id});cur=l;last=0;var vh="",ph="";
if(l.video_path){var s=await sb.storage.from("lectures").createSignedUrl(l.video_path,3600);if(s.data)vh='<video id="vid" controls controlsList="nodownload" disablePictureInPicture oncontextmenu="return false" playsinline style="width:100%;border-radius:12px;background:#000" src="'+s.data.signedUrl+'"></video>'}
else if(l.video_url){var m=l.video_url.match(/(?:youtu\.be\/|v=)([\w-]{11})/);vh=m?'<iframe style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px" src="https://www.youtube-nocookie.com/embed/'+m[1]+'" allowfullscreen></iframe>':'<a class="btn" target="_blank" rel="noopener" href="'+esc(l.video_url)+'">Open the video</a>'}
if(l.pdf_path){var p=await sb.storage.from("lectures").createSignedUrl(l.pdf_path,3600);if(p.data)ph='<a class="btn sf" target="_blank" rel="noopener" href="'+p.data.signedUrl+'">Open the PDF</a>'}
$("list").classList.add("hide");$("view").classList.remove("hide");
$("view").innerHTML='<div class="row" style="margin-top:0"><button class="btn alt" id="bk">Back</button></div><h2 style="margin-top:12px">'+esc(l.title)+'</h2>'+vh+'<div class="panel" style="margin-top:14px"><h3>Main topics</h3><div class="row" style="margin-top:0">'+((l.topics||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("")||'<span class="sub">No topics listed.</span>')+'</div></div>'+(l.notes?'<div class="panel"><h3>Read along</h3><div class="fa" style="white-space:pre-wrap;font-size:1.05rem">'+esc(l.notes)+'</div></div>':'')+(ph?'<div class="row">'+ph+'</div>':'');
$("bk").onclick=function(){location.reload()};var v=$("vid");
if(v){var save=function(done){var s=Math.floor(v.currentTime);if(!done&&s-last<15)return;last=s;sb.from("lecture_views").upsert({lecture_id:l.id,student_id:U.id,seconds_watched:Math.max(s,(V[l.id]||{}).seconds_watched||0),completed:!!done||(V[l.id]||{}).completed||false,last_viewed:new Date().toISOString()},{onConflict:"lecture_id,student_id"}).then(function(r){if(!r.error)V[l.id]={seconds_watched:s,completed:!!done}})};
v.ontimeupdate=function(){save(v.duration&&v.currentTime/v.duration>.9)};v.onended=function(){save(true)}}
else sb.from("lecture_views").upsert({lecture_id:l.id,student_id:U.id,last_viewed:new Date().toISOString()},{onConflict:"lecture_id,student_id"})}
init();
</script></body></html>
